<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agência Pixel</title>
<style>
:root{--bg:#10172a;--pn:#1a2440;--pn2:#253257;--ink:#eef2fb;--mut:#aeb9d4;--gold:#f6a04d;--blue:#4b8bd4;--grn:#3ccf7a;--red:#ff6b6b;--vio:#a678ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 "Segoe UI",Roboto,"Noto Sans",Ubuntu,Arial,sans-serif;min-height:100%}
body{background:radial-gradient(circle at 50% -10%,#1f4e8c 0,transparent 55%),var(--bg);min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:8px 12px;background:#0e0c18ee;border-bottom:1px solid #2e2848;backdrop-filter:blur(6px)}
.topbar .brand{flex:1;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .brand span{color:var(--gold)}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 48px}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:disabled{cursor:not-allowed}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--gold);color:#1b1630;font-weight:800;border-radius:14px;padding:14px 22px;font-size:18px;box-shadow:0 5px 0 #b38f10;transition:transform .08s;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b38f10}
.btn:disabled{opacity:.45;box-shadow:none}
.btn.sec{background:var(--pn2);color:var(--ink);box-shadow:0 5px 0 #15121f}
.btn.red{background:var(--red);color:#2a0b0b;box-shadow:0 5px 0 #a33}
.btn.full{width:100%}
.icon-btn{background:var(--pn2);border-radius:12px;padding:8px 12px;font-size:15px;font-weight:700}
.icon-btn.rst{background:#4a2233;color:#ffd6dc}
h1{font-size:clamp(34px,9vw,54px);line-height:1;margin:6px 0 6px;letter-spacing:-.02em}
h1 span{color:var(--gold)}
h2{font-size:24px;margin:0 0 8px}
.sub{color:var(--mut);margin:0 0 16px}
.panel{background:var(--pn);border:2px solid #3a3358;border-radius:18px;padding:16px;margin-bottom:14px}
label.f{display:block;font-weight:700;font-size:15px;margin:10px 0 4px}
input.t,select.t{width:100%;font:inherit;color:var(--ink);background:#15121f;border:2px solid #463e6b;border-radius:12px;padding:11px 12px}
input.t:focus,select.t:focus{outline:none;border-color:var(--gold)}
.row2{display:grid;grid-template-columns:110px 1fr;gap:10px}
.hint{font-size:14px;color:var(--gold);margin-top:8px;min-height:20px}
.idcard{display:flex;align-items:center;gap:12px;background:var(--pn2);border-radius:14px;padding:12px}
.idcard .e{font-size:36px}.idcard b{display:block}.idcard small{color:var(--mut)}
.heroes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 6px}
.hero{background:var(--pn2);border:3px solid transparent;border-radius:16px;padding:10px 6px;text-align:center}
.hero .e{font-size:40px;display:block}
.hero.on{border-color:var(--gold);background:#3a2f5c}
.hero small{display:block;color:var(--mut);font-size:12.5px}
.how{margin:0;padding-left:20px;color:var(--mut)}.how li{margin:4px 0}.how b{color:var(--ink)}
.map{display:grid;gap:12px}
.floor{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--pn);border:2px solid #3a3358;border-radius:18px;padding:14px}
.floor .fi{font-size:40px;width:56px;text-align:center;flex:none}
.floor .ft{flex:1}.floor .ft b{display:block;font-size:19px}.floor .ft small{color:var(--mut)}
.floor .st{font-size:20px;letter-spacing:2px;flex:none;color:var(--gold)}
.floor.lock{opacity:.45}.floor.next{border-color:var(--gold);box-shadow:0 0 0 3px #ffd43b33}
.cta{display:inline-block;background:var(--gold);color:#1b1630;font-weight:800;border-radius:8px;padding:2px 8px;font-size:13px;margin-top:4px}
.notabox{display:flex;justify-content:space-between;align-items:center;background:var(--pn2);border-radius:14px;padding:12px 14px;margin:14px 0}
.notabox b{font-size:26px;color:var(--gold)}
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.hearts{font-size:22px;letter-spacing:1px;white-space:nowrap}
.hud .qn,.hud .xp,#paraMapa{white-space:nowrap}
#paraMapa{padding:7px 10px}
@media (max-width:400px){.hearts{font-size:18px;letter-spacing:0}.hud{gap:6px}.hud .xp{padding:5px 9px;font-size:15px}.hud .qn{font-size:14px}#paraMapa{font-size:14px;padding:6px 8px}}
.xp{background:var(--pn2);border-radius:999px;padding:6px 12px;font-weight:800;color:var(--gold)}
.qn{color:var(--mut);font-weight:700;font-size:15px}
.arena{display:flex;align-items:center;gap:12px;background:var(--pn);border:2px solid #3a3358;border-radius:18px;padding:12px 14px;margin-bottom:12px}
.foe{font-size:48px}
.foe.hit{animation:hit .45s}
@keyframes hit{0%{transform:none}25%{transform:translateX(10px) rotate(8deg);filter:brightness(2)}60%{transform:translateX(-6px)}100%{transform:none}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.foe-info{flex:1}.foe-info b{font-size:17px}
.bar{height:12px;background:#0f0d18;border-radius:999px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),#ff9f6b);transition:width .4s}
.qcard{background:var(--pn);border:2px solid #3a3358;border-radius:18px;padding:16px}
.qid{float:right;font:700 12px "Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace;color:var(--mut);background:#15121f;border:1px solid #3a3358;border-radius:6px;padding:3px 7px;margin-left:8px}
.fb-id{font-size:13px;color:var(--mut);margin:0 0 10px!important}
.qtype{display:inline-block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#1b1630;background:var(--vio);border-radius:8px;padding:3px 8px;margin-bottom:8px}
.qtxt{font-size:19px;font-weight:700;margin:0 0 12px}
.code{background:#1e1f24;border-radius:12px;overflow:hidden;margin-bottom:12px;border:1px solid #33343c}
.code pre{margin:0;padding:12px 14px;font:15px/1.55 "Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace;white-space:pre-wrap;word-break:break-word;color:#e6e6e6}
.t-kw{color:#569cd6}.t-fn{color:#dcdcaa}.t-str{color:#ce9178}.t-num{color:#b5cea8}.t-com{color:#6a9955}.t-id{color:#9cdcfe}.t-op{color:#d4d4d4}.t-brace{color:#da70d6;font-weight:700}.t-var{color:#9cdcfe}
.slot{display:inline-block;min-width:34px;text-align:center;border-bottom:3px dashed var(--gold);color:var(--gold);font-weight:700}
.inp{font-size:14px;color:var(--mut);margin:-4px 0 12px}
.inp code{background:var(--pn2);color:var(--gold);padding:1px 7px;border-radius:6px}
.ops{display:grid;gap:10px}
.op{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--pn2);border:2px solid #463e6b;border-radius:14px;padding:12px 14px;min-height:54px}
.op .l{flex:none;width:30px;height:30px;border-radius:8px;background:var(--vio);color:#1b1630;font-weight:900;display:grid;place-items:center}
.op code{font:15px "Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace;word-break:break-word;white-space:pre-wrap}
.op.ok{border-color:var(--grn);background:#1d3b2c}.op.no{border-color:var(--red);background:#3e1f26}
.lines{background:#1e1f24;border-radius:12px;overflow:hidden;margin-bottom:6px;border:1px solid #33343c}
.ln{display:flex;width:100%;background:transparent;color:#e6e6e6;text-align:left;padding:9px 10px;border-bottom:1px solid #2a2b31;font:15px/1.5 "Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace}
.ln:last-child{border-bottom:0}
.ln .n{flex:none;width:28px;color:#6e7181}
.ln code{white-space:pre-wrap;word-break:break-word;font:inherit}
.ln:hover:not(:disabled){background:#2a2b33}
.ln.ok{background:#1d3b2c}.ln.no{background:#3e1f26}
.pz-lbl{font-size:13px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 6px}
.pz{min-height:56px;border:2px dashed #463e6b;border-radius:12px;padding:6px;display:grid;gap:6px}
.pz.ans{border-color:var(--gold)}
.blk{display:flex;text-align:left;width:100%;background:#1e1f24;border:1px solid #3c3e48;border-radius:10px;padding:9px 10px;font:14.5px/1.45 "Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace}
.blk code{white-space:pre-wrap;word-break:break-word;font:inherit}
.op .tx{font-size:16px;line-height:1.4;text-align:left}
.ln.tx,.blk.tx{font-family:inherit}
.caso-q{background:#fff6cc;color:#3b2f00;border-left:6px solid #ffd43b;border-radius:10px;padding:10px 12px;margin:0 0 12px;white-space:pre-wrap;line-height:1.45}
.blk .n{flex:none;width:24px;color:var(--gold);font-weight:700}
.empty{color:var(--mut);font-size:14px;padding:10px;text-align:center}
.fb{margin-top:14px;border-radius:14px;padding:14px;border-left:8px solid}
.fb.ok{background:#173226;border-color:var(--grn)}.fb.no{background:#3a1d24;border-color:var(--red)}
.fb h3{margin:0 0 6px;font-size:18px}.fb p{margin:0 0 8px}
.fb .real{font:14px "Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace;background:#0f0d18;border-radius:8px;padding:8px 10px;white-space:pre-wrap;word-break:break-word;margin:0 0 10px}
.center{text-align:center}
.big-ico{font-size:72px;display:block;margin:6px 0}
.stars{font-size:34px;letter-spacing:4px;color:var(--gold)}
.pop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:26px;white-space:nowrap;font-weight:900;color:var(--gold);pointer-events:none;text-shadow:0 3px 0 #000;animation:pop .9s forwards;z-index:30}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-90%)}}
.foot{color:var(--mut);font-size:13px;text-align:center;margin-top:20px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
.steps{margin:6px 0 0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding-left:40px;margin:10px 0}
.steps li::before{content:counter(s);position:absolute;left:0;top:-1px;width:28px;height:28px;border-radius:50%;background:var(--grn);color:#082414;font-weight:900;display:grid;place-items:center;font-size:15px}
#prev{width:100%;border-radius:14px;border:2px solid #3a3358;display:block;margin:10px 0}
/* modal */
.ov{position:fixed;inset:0;z-index:50;background:#07060cd9;display:grid;place-items:center;padding:16px}
.md{background:var(--pn);border:2px solid #4a4170;border-radius:20px;padding:20px;max-width:440px;width:100%}
.md h2{margin-top:0}
/* pegadinha */
.prank{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:radial-gradient(circle,#4a0f1c 0,#0b0710 70%);animation:alarm 1s infinite}
@keyframes alarm{50%{background:radial-gradient(circle,#7a1426 0,#0b0710 70%)}}
.prank.calm{animation:none;background:radial-gradient(circle,#24474a 0,#0b0710 70%)}
.pk{text-align:center;max-width:440px}
.pk-t{font-size:clamp(28px,8vw,40px);font-weight:900;line-height:1.1;margin-bottom:8px}
.pk-s{font-size:19px;color:#ffd6dc;margin-bottom:12px}
.pk-ring{position:relative;width:200px;height:200px;margin:12px auto}
.pk-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.pk-ring circle{fill:none;stroke-width:12}
.pk-ring .bg{stroke:#ffffff22}
.pk-ring .fg{stroke:var(--red);stroke-linecap:round;stroke-dasharray:327;stroke-dashoffset:0;transition:stroke-dashoffset 4.5s linear}
.pk-n{position:absolute;inset:0;display:grid;place-items:center;font-size:96px;font-weight:900;color:#fff}
.pk-n.tick{animation:tick .9s}
@keyframes tick{0%{transform:scale(1.8);opacity:0}30%{transform:scale(1);opacity:1}100%{transform:scale(.9)}}
.pk-laugh{font-size:110px;line-height:1;animation:laugh .5s infinite alternate}
@keyframes laugh{from{transform:rotate(-12deg) scale(1)}to{transform:rotate(12deg) scale(1.12)}}
.pk-note{font-size:14px;color:var(--mut);margin:10px 0 16px}
body.batalha #home{display:none}
.printBadge{position:fixed;right:12px;bottom:12px;z-index:45;background:#0e0c18e6;color:var(--gold);border:1px solid #ffd43b66;border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px;pointer-events:none}
.pk-warn{background:#3a0d14;border:2px solid var(--red);border-radius:14px;padding:12px 14px;margin:12px 0 16px;color:#ffd6dc;font-weight:700;font-size:17px}
/* game over */
.go{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(0,0,0,.84);animation:goBg 1.6s ease both}
@keyframes goBg{from{background:rgba(0,0,0,0)}}
.go-band{width:100%;padding:6vh 12px;text-align:center;background:linear-gradient(180deg,transparent,rgba(0,0,0,.92) 22%,rgba(0,0,0,.92) 78%,transparent)}
.go-t{font-family:"Times New Roman",Georgia,"DejaVu Serif","Liberation Serif",serif;font-weight:400;font-size:clamp(30px,10vw,112px);white-space:nowrap;color:#a3151a;letter-spacing:.06em;line-height:1;text-shadow:0 0 22px #5a0a0d;animation:goT 3.2s cubic-bezier(.2,.6,.3,1) .5s both}
@keyframes goT{from{opacity:0;transform:scale(.9);filter:blur(10px)}to{opacity:1;transform:scale(1.04);filter:blur(0)}}
.go-info{text-align:center;color:#d8cfe9;max-width:440px;padding:0 16px;animation:goIn .8s ease 3.6s both}
.go-info p{margin:6px 0}.go-info .btn{margin-top:16px}
@keyframes goIn{from{opacity:0;visibility:hidden}to{opacity:1;visibility:visible}}
.ok-list{margin:8px 0 0;padding:0;list-style:none}.ok-list li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #3a3358}
.ok-list .st{color:var(--gold);letter-spacing:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* sem ligaduras: // e != aparecem sempre como dois caracteres */
pre,code,.ln,.blk,.op code,.code,.out,.real,.mk,#cod,#rcod{font-variant-ligatures:none!important;font-feature-settings:"liga" 0,"calt" 0!important}
</style></head><body>
<div class="topbar"><a class="icon-btn" id="home" href="index.html" aria-label="Início do site" style="text-decoration:none">🏠</a><span class="brand">🏢 Agência <span>Pixel</span></span><button class="icon-btn" id="som" aria-label="Som">🔊</button><button class="icon-btn rst" id="reiniciar">🔁 Reiniciar</button></div>
<div class="wrap" id="app"></div>
<script src="config.js"></script>
<script>

/* ---------- compartilhado: realce de Python + renderização de slides + sincronização ---------- */
const SYNC_KEY = 'aula_info2adm_ieel_v1';

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function md(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code class="ic">$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>');
}

const PY_KW = new Set(['if','else','elif','for','while','def','return','import','from','in','and','or','not','True','False','None']);
const PY_BI = new Set(['print','input','int','str','float','len']);
function hlStr(tok) {
  const isF = /^[fF]/.test(tok);
  const body = isF ? tok.slice(1) : tok;
  let html = isF ? '<span class="t-kw">' + tok[0] + '</span>' : '';
  if (!isF) return html + '<span class="t-str">' + esc(body) + '</span>';
  return html + body.split(/(\{[^{}]*\})/).map(p =>
    /^\{[^{}]*\}$/.test(p)
      ? '<span class="t-brace">{</span><span class="t-var">' + esc(p.slice(1, -1)) + '</span><span class="t-brace">}</span>'
      : '<span class="t-str">' + esc(p) + '</span>'
  ).join('');
}
function hl(src) {
  const re = /(#[^\n]*)|([fF]?"(?:[^"\\\n]|\\.)*"|[fF]?'(?:[^'\\\n]|\\.)*'|[fF]?"(?:[^"\\\n]|\\.)*|[fF]?'(?:[^'\\\n]|\\.)*)|([A-Za-z_À-ÿ][A-Za-z0-9_À-ÿ]*)|(\d+(?:\.\d+)?)|(\/\/|\*\*|==|!=|<=|>=)|([\s\S])/g;
  let out = '', m;
  while ((m = re.exec(src))) {
    if (m[1]) out += '<span class="t-com">' + esc(m[1]) + '</span>';
    else if (m[2]) out += hlStr(m[2]);
    else if (m[3]) {
      const w = m[3];
      if (/^[fF]$/.test(w) && /["']/.test(src[re.lastIndex] || '')) { out += esc(w); }
      else out += PY_KW.has(w) ? '<span class="t-kw">' + w + '</span>'
        : PY_BI.has(w) ? '<span class="t-fn">' + w + '</span>'
        : '<span class="t-id">' + esc(w) + '</span>';
    }
    else if (m[4]) out += '<span class="t-num">' + m[4] + '</span>';
    else if (m[5]) out += '<span class="t-op">' + esc(m[5]) + '</span>';
    else out += /[=+\-*/%<>]/.test(m[6]) ? '<span class="t-op">' + esc(m[6]) + '</span>' : esc(m[6]);
  }
  return out;
}
function codeBox(src, lang) {
  const body = lang === 'txt' ? esc(src) : hl(src);
  return '<div class="code"><div class="code-bar"><span class="play">▶</span><span class="lang">' + (lang === 'txt' ? 'Portugol' : 'Python') + '</span></div><pre>' + body + '</pre></div>';
}
function outBox(txt, isErr) {
  return '<div class="out' + (isErr ? ' err' : '') + '"><span class="out-lbl">' + (isErr ? 'Erro' : 'Saída') + '</span><pre>' + esc(txt) + '</pre></div>';
}

function blocoNome(id) { const b = BLOCOS.find(x => x.id === id); return b ? b.nome : ''; }

/* ---------- digitação do código ---------- */
function temDigitacao(s) { return s.tipo === 'conteudo' && !!s.code; }
function passosDigitacao(s) { const p = []; s.code.split('\n').forEach((l, k) => { if (l.trim()) p.push(k); }); return p; }
function totalPassos(s) { return passosDigitacao(s).length + (s.out ? 1 : 0); }
function codeDigitando(s, dig, animar) {
  const linhas = s.code.split('\n'), p = passosDigitacao(s);
  const ate = dig > 0 ? p[Math.min(dig, p.length) - 1] : -1, vis = [];
  for (let k = 0; k <= ate; k++) {
    if (animar && dig <= p.length && k === ate) vis.push('<span class="tw" data-t="' + esc(linhas[k]) + '" data-h="' + esc(hl(linhas[k])) + '"></span>');
    else vis.push(hl(linhas[k]));
  }
  const live = vis.join('\n') + (dig < p.length ? '<span class="caret">▌</span>' : '');
  let html = '<div class="code"><div class="code-bar"><span class="play">▶</span><span class="lang">Python</span></div><pre class="stack"><span class="ghost">' + hl(s.code) + '</span><span class="live">' + live + '</span></pre></div>';
  if (s.out) html += outBox(s.out).replace('class="out"', 'class="out ' + (dig > p.length ? 'out-in' : 'out-ghost') + '"');
  return html;
}
function renderSlide(s, idx, revealed, dig, animar) {
  const n = idx + 1, total = SLIDES.length;
  const head = s.tipo === 'hero' ? '' :
    '<div class="s-head"><span class="s-bloco">' + esc(blocoNome(s.b)) + '</span><span class="s-num">' + n + ' / ' + total + '</span></div>';
  let body = '';
  if (s.tipo === 'hero') {
    body = '<div class="hero"><div class="hero-ico">' + s.icone + '</div><div class="hero-k">' + md(s.kicker) + '</div><h1>' + md(s.titulo) + '</h1><div class="hero-sub">' + md(s.sub) + '</div></div>';
  } else if (s.tipo === 'conteudo') {
    const itens = '<ul class="itens">' + s.itens.map(i => '<li>' + md(i) + '</li>').join('') + '</ul>';
    if (s.code) {
      const cod = dig === undefined || dig === null ? codeBox(s.code) + (s.out ? outBox(s.out) : '') : codeDigitando(s, dig, animar);
      body = '<h2>' + md(s.titulo) + '</h2><div class="cols' + (s.code.split('\n').length > 3 ? ' wide-code' : '') + '"><div>' + itens + '</div><div>' + cod + '</div></div>';
    } else body = '<h2>' + md(s.titulo) + '</h2>' + itens.replace('class="itens"', 'class="itens big"');
  } else if (s.tipo === 'caso') {
    body = '<h2><span class="tag tag-caso">' + esc(s.tag || 'Situação-problema') + '</span> ' + md(s.titulo) + '</h2>' +
      '<div class="caso">' + (s.mock ? '<div class="caso-cols"><div>' : '') + '<p class="hist">' + md(s.historia) + '</p><ul class="dados">' + s.dados.map(d => '<li>' + md(d) + '</li>').join('') + '</ul>' + (s.mock ? '</div><div class="pm-wrap"' + (s.pm ? ' style="--pm:' + s.pm + 'px"' : '') + '>' + s.mock + '</div></div>' : '') +
      '<div class="perg">❓ ' + md(s.pergunta) + '</div>' + (s.fonte ? '<div class="fonte">' + md(s.fonte) + '</div>' : '') + '</div>';
  } else if (s.tipo === 'quadro') {
    const cols = s.cols || Math.min(s.cards.length, 4);
    body = '<h2>' + md(s.titulo) + '</h2><div class="quadro" style="grid-template-columns:repeat(' + cols + ',1fr)">' +
      s.cards.map(c => '<div class="card' + (c.erro ? ' card-err' : '') + '"><div class="card-cab">' + md(c.cab) + '</div>' +
        (c.big ? '<div class="card-big">' + esc(c.big) + '</div>' : '') +
        (c.mock ? '<div class="pm-wrap"' + (c.pm ? ' style="--pm:' + c.pm + 'px"' : '') + '>' + c.mock + '</div>' : '') + (c.code ? codeBox(c.code, c.lang) : '') + (c.res ? outBox(c.res, c.erro) : '') +
        (c.txt ? '<div class="card-txt">' + md(c.txt) + '</div>' : '') + '</div>').join('') + '</div>' +
      (s.nota ? '<div class="nota">' + md(s.nota) + '</div>' : '');
  } else if (s.tipo === 'atividade') {
    const passos = '<ol class="passos">' + s.passos.map(p => '<li>' + md(p) + '</li>').join('') + '</ol>';
    const resp = s.resposta_mock ? (revealed ? '<div class="resp"><div class="resp-lbl">✅ Uma resposta possível</div><div class="pm-wrap">' + s.resposta_mock + '</div></div>' : '<div class="resp-wait">🔒 A resposta aparece no final</div>') : s.resposta ? (revealed ? '<div class="resp"><div class="resp-lbl">✅ Uma resposta possível</div>' + codeBox(s.resposta) + outBox(s.out) + '</div>'
      : '<div class="resp-wait">🔒 A resposta aparece no final</div>') : '';
    body = '<h2><span class="tag tag-ativ">Mãos à obra · ' + s.tempo + ' min</span> ' + md(s.titulo) + '</h2>' +
      (s.resposta || s.resposta_mock ? '<div class="cols"><div>' + passos + '</div><div>' + resp + '</div></div>' : passos);
  } else if (s.tipo === 'quiz') {
    const L = 'ABCD';
    const ops = '<div class="ops">' + s.opcoes.map((o, k) => {
      const cls = revealed ? (k === s.correta ? ' ok' : ' no') : '';
      return '<div class="op' + cls + '"><span class="op-l">' + L[k] + '</span>' + (s.opcoes_code ? '<code class="op-c">' + esc(o) + '</code>' : '<span>' + esc(o) + '</span>') + '</div>';
    }).join('') + '</div>';
    body = '<h2><span class="tag tag-quiz">Quiz</span> ' + md(s.pergunta) + '</h2>' +
      (s.code ? '<div class="cols quiz-cols"><div>' + codeBox(s.code) + '</div><div>' + ops + '</div></div>' : ops) +
      (revealed ? '<div class="explica">💡 ' + md(s.explica) + '</div>' : '');
  }
  return '<div class="slide t-' + s.tipo + '">' + head + '<div class="s-body"><div class="s-inner">' + body + '</div></div></div>';
}

/* reduz o conteúdo se não couber no slide (rede de segurança) */
function fitBody(root) {
  const b = root.querySelector('.s-body'), inn = root.querySelector('.s-inner');
  if (!b || !inn) return;
  let z = 1; inn.style.zoom = 1;
  while (inn.getBoundingClientRect().height > b.getBoundingClientRect().height + 1 && z > 0.66) { z -= 0.03; inn.style.zoom = z; }
}
/* --- estado compartilhado: slide atual, respostas reveladas, linhas digitadas --- */
function salvar(p) { st = writeSync(Object.assign({ i: st.i || 0, rev: st.rev || {}, dig: st.dig || {} }, p)); return st; }
function digDe(x, i) { return (x.dig || {})[i] || 0; }
function avancar() {
  const i = st.i || 0, s = SLIDES[i], d = digDe(st, i);
  if (temDigitacao(s) && d < totalPassos(s)) { const D = Object.assign({}, st.dig || {}); D[i] = d + 1; return salvar({ dig: D }); }
  return i < SLIDES.length - 1 ? salvar({ i: i + 1 }) : st;
}
function voltar() { const i = st.i || 0; return i > 0 ? salvar({ i: i - 1 }) : st; }
function irPara(i) { return salvar({ i: Math.max(0, Math.min(SLIDES.length - 1, i)) }); }
function zerarAula() { st = writeSync({ i: 0, rev: {}, dig: {} }); return st; }
function alternarRev() { const rev = Object.assign({}, st.rev || {}); rev[st.i || 0] = !rev[st.i || 0]; return salvar({ rev }); }
function definirDig(v) { const D = Object.assign({}, st.dig || {}); D[st.i || 0] = v; return salvar({ dig: D }); }
/* --- sincronização entre as duas janelas (mesma pasta, mesmo navegador) --- */
function readSync() {
  try { return JSON.parse(localStorage.getItem(SYNC_KEY)) || { i: 0, rev: {}, t: 0 }; }
  catch (e) { return { i: 0, rev: {}, t: 0 }; }
}
function writeSync(st) {
  st.t = Date.now();
  try { localStorage.setItem(SYNC_KEY, JSON.stringify(st)); } catch (e) {}
  return st;
}
function onSync(cb) {
  let last = -1;
  const check = () => { const st = readSync(); if (st.t !== last) { last = st.t; cb(st); } };
  window.addEventListener('storage', e => { if (e.key === SYNC_KEY) check(); });
  setInterval(check, 500);
  check();
}

/* ---------- placar: nota, código de conferência (usado no jogo e no conferidor) ---------- */
/* colégio vai junto na turma ("IEEL · 1º Ano ADM - Turma A"): o formulário não muda e o código de conferência já inclui o colégio */
const COLEGIOS = [
  { curto: 'IEEL', nome: 'Instituto de Educação Estadual de Londrina', turmas: ['2º Ano ADM - Turma A', '2º Ano ADM - Turma B', '2º Ano ADM - Turma C'] },
];
const SEP_COL = ' · ';
const TURMAS = COLEGIOS.flatMap(c => c.turmas.map(t => c.curto + SEP_COL + t));
const escT = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
function separarTurma(v) {

const NOTA_POR_ESTRELAS = [0, 1.5, 2.0, 2.5];   /* andar concluído com 1, 2 ou 3 estrelas; 4 andares = 10 */
const SALT = 'agencia-pixel-2adm-rocco-2026';
const EPOCA = Date.UTC(2026, 0, 1);
const NOMES_ANDAR = ['Estúdio de Design', 'Sala de Reunião', 'Departamento Jurídico', 'Diretoria'];

function cyrb53(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
}
function normTxt(s) {
  return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
}
function calcNota(stars) { return stars.reduce((a, s) => a + NOTA_POR_ESTRELAS[s || 0], 0); }

/* empacota nota, estrelas, saídas, partida e minuto em um número; o checksum amarra ao aluno */
function gerarCodigo(id, stars, saidas, partida, minuto, restaurado) {
  const nota10 = Math.round(calcNota(stars) * 10) + (restaurado ? 200 : 0);
  const sb = (stars[0] || 0) + 4 * (stars[1] || 0) + 16 * (stars[2] || 0) + 64 * (stars[3] || 0);
  const p = (((nota10 * 256 + sb) * 64 + Math.min(saidas, 63)) * 64 + Math.min(partida, 63)) * 16777216 + minuto;
  const chk = cyrb53(normTxt(id.nome) + '|' + String(id.numero).trim() + '|' + normTxt(id.turma) + '|' + p + '|' + SALT) % 60466176;
  return p.toString(36).toUpperCase() + '-' + chk.toString(36).toUpperCase().padStart(5, '0');
}
function lerCodigo(code) {
  const m = String(code).trim().toUpperCase().replace(/\s/g, '').match(/^([0-9A-Z]+)-([0-9A-Z]{5})$/);
  if (!m) return null;
  let p = parseInt(m[1], 36);
  if (!Number.isSafeInteger(p)) return null;
  const minuto = p % 16777216; p = Math.floor(p / 16777216);
  const partida = p % 64; p = Math.floor(p / 64);
  const saidas = p % 64; p = Math.floor(p / 64);
  const sb = p % 256; let nota10 = Math.floor(p / 256); const restaurado = nota10 >= 200; if (restaurado) nota10 -= 200;
  const stars = [sb % 4, Math.floor(sb / 4) % 4, Math.floor(sb / 16) % 4, Math.floor(sb / 64) % 4];
  return { nota: nota10 / 10, restaurado, stars, saidas, partida, minuto, data: new Date(EPOCA + minuto * 60000), chk: m[2], payload: m[1] };
}
function validarCodigo(code, id) {
  const d = lerCodigo(code);
  if (!d) return false;
  return gerarCodigo(id, d.stars, d.saidas, d.partida, d.minuto, d.restaurado) === String(code).trim().toUpperCase().replace(/\s/g, '');
}
function minutoAgora() { return Math.max(0, Math.min(16777215, Math.floor((Date.now() - EPOCA) / 60000))); }
function fmtData(d) {

}

/* aceita o código com espaços, sem hífen ou com O/0 e I/1 trocados na digitação */
function normCodigo(code) {
  let c = String(code).toUpperCase().replace(/[\s\u2010-\u2015]/g, '').replace(/-+/g, '-');
  if (!c.includes('-') && c.length > 5) c = c.slice(0, -5) + '-' + c.slice(-5);
  return c;
}
function acharCodigo(code, id) {
  const c = normCodigo(code);
  if (validarCodigo(c, id)) return c;
  const pos = []; for (let i = 0; i < c.length; i++) if ('O0I1'.includes(c[i])) pos.push(i);
  if (!pos.length || pos.length > 12) return null;
  const tr = { O: '0', '0': 'O', I: '1', '1': 'I' };
  for (let m = 1; m < (1 << pos.length); m++) {
    const a = c.split(''); pos.forEach((p, k) => { if ((m >> k) & 1) a[p] = tr[a[p]]; });
    const v = a.join(''); if (validarCodigo(v, id)) return v;
  }
  return null;
}

/* ---------- Google Forms: link pré-preenchido com marcadores (NOME, NUMERO, TURMA, NOTA, CODIGO...) ---------- */
const CAMPOS_FORM = ['NOME', 'NUMERO', 'TURMA', 'NOTA', 'CODIGO', 'ESTRELAS', 'SAIDAS', 'SITUACAO'];
const CAMPOS_OBRIG = ['NOME', 'NUMERO', 'TURMA', 'CODIGO'];
function analisarFormulario(base) {
  base = String(base || '').trim();
  if (!base) return { ok: false, vazio: true, motivo: 'Nenhum link configurado.', campos: [] };
  let u; try { u = new URL(base); } catch (e) { return { ok: false, motivo: 'O link não é um endereço válido.', campos: [] }; }
  if (u.hostname !== 'docs.google.com' || u.pathname.indexOf('/forms/') !== 0) return { ok: false, motivo: 'O link precisa ser do Google Forms (começa com https://docs.google.com/forms/). O link curto forms.gle não serve.', campos: [] };
  const mapa = {};
  u.searchParams.forEach((v, k) => { if (k.indexOf('entry.') === 0) { const c = normTxt(v).toUpperCase(); if (CAMPOS_FORM.includes(c)) mapa[c] = k; } });
  const faltam = CAMPOS_OBRIG.filter(c => !mapa[c]);
  return { ok: !faltam.length, motivo: faltam.length ? 'Faltam marcadores no link: ' + faltam.join(', ') + '.' : '', campos: Object.keys(mapa), mapa, url: u.toString() };
}
function montarLinkFormulario(base, vals) {
  const a = analisarFormulario(base); if (!a.ok) return null;
  const u = new URL(a.url);
  Object.keys(a.mapa).forEach(c => { if (vals[c] !== undefined) u.searchParams.set(a.mapa[c], String(vals[c])); });
  return u.toString();
}

    const cs = d.stars[i], s = stats(a.id), ex = extra && extra.andares && extra.andares[a.id];
    if (cs > s.stars) { s.stars = cs; s.rest = true; s.erros = 3 - cs; }
    if (ex) { s.tent = Math.max(s.tent || 0, +ex.tent || 0); s.xp = Math.max(s.xp || 0, +ex.xp || 0); }
  });
  let k = 0; while (k < ANDARES.length && stats(ANDARES[k].id).stars > 0) k++;
  save.lib = Math.max(save.lib, Math.min(k + 1, ANDARES.length));
  if (stats(ANDARES[ANDARES.length - 1].id).stars > 0) save.fim = true;
  store();
}
function tentarRestaurar(id, codigoDigitado, extra, hint) {
  if (!lerCodigo(normCodigo(codigoDigitado))) { hint.textContent = '👆 Código incompleto ou com formato errado. Copie com o hífen, igual está na imagem.'; beep(200, .15); return; }
  const codigo = acharCodigo(codigoDigitado, id);
  if (!codigo) { hint.textContent = '👆 O código não bate com esse nome, número e turma. Escreva exatamente como está na imagem do placar.'; beep(200, .15); return; }
  const ok = () => {
    aplicarRestauro(id, codigo, extra);
    const st = estrelas();
    modal('✅ Progresso recuperado!', '<p>Bem-vindo de volta, <b>' + esc(meta.id.nome.split(' ')[0]) + '</b>. Seus andares:</p><ul class="ok-list">' +
      ANDARES.map((a, i) => '<li><span>' + a.id + '. ' + esc(a.nome) + '</span><span class="st">' + (st[i] ? '★'.repeat(st[i]) + '☆'.repeat(3 - st[i]) : 'a jogar') + '</span></li>').join('') + '</ul>',
      [{ t: '🗺️ Ir para o mapa', fn: telaMapa }]);
  };
  if (meta.id && !mesmoAluno(id)) modal('Trocar de aluno?', '<p>Este computador tem o progresso de <b>' + esc(meta.id.nome) + '</b>. Ele será substituído pelo de <b>' + esc(id.nome) + '</b>.</p>',
    [{ t: 'Cancelar', cls: 'sec' }, { t: 'Continuar', cls: 'red', fn: ok }]);
  else ok();
}
function telaRestaurar() {
  topo();
  const id = meta.id || { nome: '', numero: '', turma: '' };
  app.innerHTML = `<h1 style="font-size:30px">Continuar de onde parei</h1>
    <p class="sub">Use o placar que você baixou em outro computador. As estrelas voltam e os andares ficam liberados.</p>
    <div class="panel"><h2>Opção 1 · Enviar a imagem do placar</h2>
      <p class="sub">É o jeito mais fácil. Tem que ser o arquivo PNG que o jogo baixou. Print da tela não funciona aqui: para print, use a opção 2.</p>
      <label class="btn full" for="arq" id="arqLbl">🖼️ Escolher a imagem do placar</label><input type="file" id="arq" accept="image/png,.png" hidden>
      <div class="hint" id="h1"></div></div>
    <div class="panel"><h2>Opção 2 · Digitar o código</h2>
      <p class="sub">Copie do placar, exatamente como está escrito.</p>
      <label class="f" for="rnome">Nome completo</label><input class="t" id="rnome" maxlength="60" value="${esc(id.nome)}">
      <label class="f" for="rnum">Número da chamada</label><input class="t" id="rnum" inputmode="numeric" maxlength="3" value="${esc(id.numero)}" style="max-width:140px">
      ${turmaHtml('r', id.turma)}
      <label class="f" for="rcod">Código de conferência</label><input class="t" id="rcod" placeholder="Ex.: FRBLB1X8GG-4CUXJ" autocomplete="off" spellcheck="false" style="font-family:'Cascadia Code',Consolas,monospace;text-transform:uppercase;font-size:19px">
      <button class="btn full" id="rok" style="margin-top:14px">✅ Continuar com este código</button>
      <div class="hint" id="h2"></div></div>
    <button class="btn sec full" id="volta">⬅ Voltar</button>`;
  const lerTurmaR = ligarTurma('r');
  $('#volta').onclick = () => meta.id && save.lib > 1 || save.run ? telaMapa() : telaInicio();
  $('#arqLbl').onclick = () => { seletorAberto = true; };
  $('#arq').onchange = e => {
    seletorAberto = false; const f = e.target.files[0], h = $('#h1'); e.target.value = '';
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      let dados = null;
      try { const t = lerTextoPNG(new Uint8Array(rd.result), PNG_KEY); dados = t && JSON.parse(decodeURIComponent(t)); } catch (err) { dados = null; }
      if (!dados || !dados.codigo) { h.textContent = '👆 Essa imagem não tem os dados do jogo (pode ser um print ou outra imagem). Use a opção 2 e digite o código.'; beep(200, .15); return; }
      tentarRestaurar({ nome: dados.nome, numero: dados.numero, turma: dados.turma }, dados.codigo, dados, h);
    };
    rd.onerror = () => { h.textContent = '👆 Não consegui abrir esse arquivo. Tente de novo ou use a opção 2.'; };
    rd.readAsArrayBuffer(f);
  };
  $('#rok').onclick = () => {
    const nome = $('#rnome').value.trim().replace(/\s+/g, ' '), numero = $('#rnum').value.trim(), turma = lerTurmaR(), h = $('#h2');
    if (!nome || !numero || !turma) { h.textContent = '👆 Preencha nome, número, colégio e turma iguais aos do placar.'; beep(200, .15); return; }
    if (!$('#rcod').value.trim()) { h.textContent = '👆 Digite o código de conferência.'; beep(200, .15); return; }
    tentarRestaurar({ nome, numero, turma }, $('#rcod').value, null, h);
  };
}

/* ---------- pegadinha e game over: saiu da tela ---------- */
let saiuEm = 0, pegadinhaAtiva = false, ultimaPegadinha = 0, ignorarSaidaAte = 0, seletorAberto = false, passeLivre = false;
const AVISOS = 4;
const TITULOS = ['👀 Saiu da tela, é?', '🤨 De novo?!', '🕵️ Te peguei mais uma vez!', '☠️ Quarta vez…'];
const emBatalha = () => !!save.run && !!meta.id;
function marcarSaida() { if (!saiuEm && emBatalha()) saiuEm = Date.now(); }
function voltou() {
  if (!saiuEm || document.hidden || !document.hasFocus()) return;   /* mouse passando sobre a janela sem foco não conta como volta */
  const ini = saiuEm, fora = Date.now() - saiuEm; saiuEm = 0;
  if (printAte && ini <= printAte) { encerrarPrint(); if (fora <= PRINT_MS) return; }   /* saída curta dentro da liberação de print não conta */
  if (seletorAberto || passeLivre) { seletorAberto = passeLivre = false; return; }
  if (fora < 2000 || !emBatalha() || pegadinhaAtiva || Date.now() < ignorarSaidaAte || Date.now() - ultimaPegadinha < 6000 || !meta.id) return;
  contarSaida();
}
/* liberação de print: digitar a palavra secreta durante o jogo libera UMA saída curta por 1 minuto */
const PALAVRA_PRINT = 'charlton', PRINT_MS = 60000, PRINTS_POR_ANDAR = 3;
let teclas = '', ultimaTecla = 0, printAte = 0, printTimer = null;
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.altKey || e.metaKey || e.key.length !== 1 || !meta.id) return;
  const ag = Date.now(); if (ag - ultimaTecla > 2500) teclas = ''; ultimaTecla = ag;
  teclas = (teclas + e.key.toLowerCase()).slice(-PALAVRA_PRINT.length);
  if (teclas === PALAVRA_PRINT) { teclas = ''; ativarPrint(); }
});
function ativarPrint() {
  if (save.run) {
    if ((save.run.prints || 0) >= PRINTS_POR_ANDAR) { pop('Limite de prints neste andar'); return; }
    save.run.prints = (save.run.prints || 0) + 1;
  }
  save.prints = (save.prints || 0) + 1; store();
  printAte = Date.now() + PRINT_MS;
  let b = document.getElementById('printBadge');
  if (!b) { b = document.createElement('div'); b.id = 'printBadge'; b.className = 'printBadge'; document.body.appendChild(b); }
  const tick = () => { const r = Math.max(0, printAte - Date.now()); const sg = Math.ceil(r / 1000); b.textContent = '📸 Pode tirar o print · ' + Math.floor(sg / 60) + ':' + String(sg % 60).padStart(2, '0'); if (!r && !saiuEm) encerrarPrint(); };   /* se saiu dentro do minuto, a liberação vale até ele voltar */
  clearInterval(printTimer); tick(); printTimer = setInterval(tick, 250);
  beep(880, .08, 'triangle');
}
function encerrarPrint() { printAte = 0; clearInterval(printTimer); const b = document.getElementById('printBadge'); if (b) b.remove(); }
/* total vai para o placar; os avisos e o game over contam só na tentativa atual do andar */
function contarSaida() {
  if (!save.run) return;
  save.saidas = Math.min(63, (save.saidas || 0) + 1);
  save.run.saidas = (save.run.saidas || 0) + 1; store();
  save.run.saidas > AVISOS ? gameOver() : pegadinha(save.run.saidas);
}
/* saiu da página no meio de uma pergunta (botão voltar, outro endereço) e voltou em menos de 30 min: conta como saída */
window.addEventListener('pagehide', () => { if (save.run && meta.id && !pegadinhaAtiva) { save.foraDesde = Date.now(); store(); } });
document.addEventListener('visibilitychange', () => document.hidden ? marcarSaida() : voltou());
window.addEventListener('blur', marcarSaida);
window.addEventListener('focus', voltou);
function pegadinha(n) {
  pegadinhaAtiva = true;
  const ov = document.createElement('div'); ov.className = 'prank';
  ov.innerHTML = `<div class="pk"><div class="pk-t">${TITULOS[Math.min(n - 1, TITULOS.length - 1)]}</div><div class="pk-s">O jogo vai <b>REINICIAR</b> em</div>
    <div class="pk-ring"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" cx="60" cy="60" r="52"/></svg><span class="pk-n" id="pkN">5</span></div>
    <div class="pk-s">Todo o seu progresso vai sumir…</div></div>`;
  document.body.appendChild(ov);
  requestAnimationFrame(() => requestAnimationFrame(() => { ov.querySelector('.fg').style.strokeDashoffset = 327; }));
  let k = 5; beep(440, .12);
  const tm = setInterval(() => {
    k--;
    if (k > 0) { const el = $('#pkN'); el.textContent = k; el.classList.remove('tick'); void el.offsetWidth; el.classList.add('tick'); beep(440 + (5 - k) * 60, .12); return; }
    clearInterval(tm);
    ov.classList.add('calm');
    const ultimo = n >= AVISOS;
    const aviso = ultimo
      ? '<div class="pk-warn">⚠️ Último aviso! Se sair da tela mais uma vez <b>neste andar</b>, é <b>GAME OVER</b>: você perde a tentativa e recomeça o andar.</div>'
      : `<div class="pk-note">Aviso <b>${n}</b> de ${AVISOS} neste andar · fica registrado no seu placar</div>`;
    ov.innerHTML = `<div class="pk"><div class="pk-laugh">😂</div><div class="pk-t">Vou não!</div><div class="pk-s">Mas não faça mais isso.</div>${aviso}<button class="btn" id="pkOk">${ultimo ? 'Entendi 😬' : 'Tá bom 😅'}</button></div>`;
    [880, 740, 880, 740, 990].forEach((f, i) => setTimeout(() => beep(f, .09, 'triangle'), i * 110));
    $('#pkOk').onclick = () => { ov.remove(); pegadinhaAtiva = false; ultimaPegadinha = Date.now(); };
  }, 900);
}
function gameOver() {
  pegadinhaAtiva = true;
  let perdido = '';
  if (save.run) { const a = andarAtual(); perdido = a ? a.nome : ''; save.run = null; store(); }
  const ov = document.createElement('div'); ov.className = 'go';
  ov.innerHTML = `<div class="go-band"><div class="go-t">VOCÊ MORREU</div></div>
    <div class="go-info"><p>Você saiu da tela <b>${(save.run && save.run.saidas) || AVISOS + 1}</b> vezes neste andar.</p>
    <p>${perdido ? 'O andar <b>' + esc(perdido) + '</b> foi perdido. As estrelas que você já tinha continuam.' : 'Nenhum andar estava em andamento, mas a saída ficou registrada.'}</p>
    <button class="btn" id="goOk">🔥 Levantar de novo</button></div>`;
  document.body.appendChild(ov);
  beep(82, 2.4, 'sine'); setTimeout(() => beep(55, 2.8, 'sine'), 300);
  $('#goOk').onclick = () => { ov.remove(); pegadinhaAtiva = false; ultimaPegadinha = Date.now(); telaMapa(); };
}

/* ---------- início ---------- */
if (save.run && !ANDARES.some(a => a.id === save.run.aid)) save.run = null;
if (meta.id && save.run) telaPergunta(); else telaInicio();
if (save.foraDesde) {
  const t = Date.now() - save.foraDesde; delete save.foraDesde; store();
  if (t > 4000 && t < 30 * 60000 && save.run && meta.id) setTimeout(contarSaida, 700);
}
</script></body></html>
