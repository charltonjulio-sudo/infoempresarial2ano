<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#14213d;color:#1d2433;font:16px/1.5 "Segoe UI",Roboto,"Noto Sans",Ubuntu,Arial,sans-serif;padding:16px}
.card{background:#fff;border-radius:18px;padding:24px;max-width:380px;width:100%;box-shadow:0 10px 0 #0b1426}

button:disabled{opacity:.6;cursor:wait}
.err{color:#c0392b;font-weight:700;min-height:24px;margin-top:10px;font-size:15px}
a{color:#2a5d8f}
</style></head><body>

const CH = 'area_professor_senha';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function abrir(senha) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']);
  const k = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.s), iterations: P.n, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.i) }, k, b64(P.c)));
}
function mostrar(html) { document.open(); document.write(html); document.close(); }
const err = document.getElementById('err'), bt = document.getElementById('bt');
if (!window.crypto || !crypto.subtle) { err.textContent = 'Este navegador não consegue abrir a área protegida. Use o Chrome atualizado e o endereço com https://.'; bt.disabled = true; }
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  if (!pw) return;
  bt.disabled = true; bt.textContent = 'Abrindo…'; err.textContent = '';
  try {
    const html = await abrir(pw);
    try { if (document.getElementById('lb').checked) sessionStorage.setItem(CH, pw); else sessionStorage.removeItem(CH); } catch (x) {}
    mostrar(html);
  } catch (x) {
    err.textContent = 'Senha errada.'; bt.disabled = false; bt.textContent = 'Entrar';
    document.getElementById('pw').select();
  }
};
(async () => { let pw = null; try { pw = sessionStorage.getItem(CH); } catch (x) {} if (pw && window.crypto && crypto.subtle) { try { mostrar(await abrir(pw)); } catch (x) { try { sessionStorage.removeItem(CH); } catch (y) {} } } })();
